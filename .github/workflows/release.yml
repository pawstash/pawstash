name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag'
        required: true
        default: 'v26.8.1-1'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            args: ""
          - platform: macos-universal
            os: macos-latest
            args: "--target universal-apple-darwin"
          - platform: linux-x64
            os: ubuntu-22.04
            args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri Desktop App
        run: pnpm tauri build ${{ matrix.args }}

      - name: Collect Desktop Binaries
        shell: bash
        run: |
          mkdir -p dist-binaries
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            find src-tauri/target -name "pawstash.exe" | head -n 1 | xargs -I {} cp {} dist-binaries/Pawstash-portable.exe || true
            find src-tauri/target -name "*.exe" | grep -i "setup" | head -n 1 | xargs -I {} cp {} dist-binaries/Pawstash-Setup.exe || true
            find src-tauri/target -name "*.msi" | head -n 1 | xargs -I {} cp {} dist-binaries/Pawstash.msi || true
          elif [ "${{ matrix.platform }}" = "linux-x64" ]; then
            find src-tauri/target -name "*.AppImage" | head -n 1 | xargs -I {} cp {} dist-binaries/Pawstash.AppImage || true
            find src-tauri/target -name "*.deb" | head -n 1 | xargs -I {} cp {} dist-binaries/Pawstash.deb || true
          elif [ "${{ matrix.platform }}" = "macos-universal" ]; then
            find src-tauri/target -name "*.dmg" | head -n 1 | xargs -I {} cp {} dist-binaries/Pawstash.dmg || true
            find src-tauri/target -name "*.app.tar.gz" | head -n 1 | xargs -I {} cp {} dist-binaries/Pawstash.app.tar.gz || true
          fi

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist-binaries/*

  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK (r26b)
        run: |
          sdkmanager "ndk;26.1.10909125"

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Initialize Android Project
        run: pnpm tauri android init --ci --skip-targets-install

      - name: Apply App Icons to Android Project
        run: |
          pnpm tauri icon src-tauri/icons/icon-manifest.json -o src-tauri/icons
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/ || true

      - name: Build Android APKs (Universal & Per-ABI)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          pnpm tauri android build --apk --target aarch64 --target armv7 --target x86_64
          pnpm tauri android build --apk --split-per-abi --target aarch64 --target armv7 --target x86_64

      - name: Build Android AAB (Google Play Bundle)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          pnpm tauri android build --aab --target aarch64 --target armv7 --target x86_64

      - name: Sign Android APKs
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'pawstash' }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          if [ -n "$SIGNING_KEY" ]; then
            echo "Signing with repository secret keystore..."
            echo "$SIGNING_KEY" | base64 --decode > /tmp/release.keystore
            find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | while read -r apk; do
              "$APKSIGNER" sign --ks /tmp/release.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASS" --key-pass "pass:$KEY_PASS" "$apk" || true
            done
            rm -f /tmp/release.keystore
          else
            echo "Signing with Android debug keystore..."
            mkdir -p "$HOME/.android"
            DEBUG_KS="$HOME/.android/debug.keystore"
            if [ ! -f "$DEBUG_KS" ]; then
              keytool -genkey -v -keystore "$DEBUG_KS" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | while read -r apk; do
              "$APKSIGNER" sign --ks "$DEBUG_KS" --ks-pass "pass:android" --key-pass "pass:android" "$apk" || true
            done
          fi

      - name: Collect Android Binaries
        shell: bash
        run: |
          mkdir -p dist-binaries
          find src-tauri/gen/android/app/build/outputs/apk -name "*arm64*.apk" -o -name "*v8a*.apk" | head -n 1 | xargs -I {} cp {} dist-binaries/Pawstash-arm64-v8a.apk || true
          find src-tauri/gen/android/app/build/outputs/apk -name "*armeabi*.apk" -o -name "*v7a*.apk" | head -n 1 | xargs -I {} cp {} dist-binaries/Pawstash-armeabi-v7a.apk || true
          find src-tauri/gen/android/app/build/outputs/apk -name "*x86_64*.apk" | head -n 1 | xargs -I {} cp {} dist-binaries/Pawstash-x86_64.apk || true
          find src-tauri/gen/android/app/build/outputs/apk -name "*universal*.apk" | head -n 1 | xargs -I {} cp {} dist-binaries/Pawstash-universal.apk || true
          find src-tauri/gen/android/app/build/outputs/bundle -name "*.aab" | head -n 1 | xargs -I {} cp {} dist-binaries/Pawstash.aab || true

          if [ -f "dist-binaries/Pawstash-universal.apk" ]; then
            cp dist-binaries/Pawstash-universal.apk dist-binaries/Pawstash.apk
          elif [ -f "dist-binaries/Pawstash-arm64-v8a.apk" ]; then
            cp dist-binaries/Pawstash-arm64-v8a.apk dist-binaries/Pawstash.apk
          fi

          if [ -f "dist-binaries/Pawstash-arm64-v8a.apk" ]; then
            cp dist-binaries/Pawstash-arm64-v8a.apk dist-binaries/Pawstash-arm64.apk
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: dist-binaries/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository for changelog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Commit Changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git tag --sort=-creatordate 2>/dev/null | grep -v "${{ github.ref_name || inputs.tag_name }}" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG..HEAD")
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" -n 50)
          fi
          {
            echo "body<<EOF"
            echo "### Changes in ${{ github.ref_name || inputs.tag_name }}"
            echo ""
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Display binaries to release
        run: ls -la release-dist

      - name: Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: 'Pawstash ${{ github.ref_name || inputs.tag_name }}'
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-pre') || contains(github.ref_name, '-') }}
          generate_release_notes: false
          files: release-dist/*
