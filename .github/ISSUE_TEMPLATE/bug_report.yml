name: Bug Report
description: Report an issue or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Android
        - Linux — Arch / Manjaro / EndeavourOS
        - Linux — Ubuntu / Debian / Mint
        - Linux — Fedora / RHEL
        - Linux — openSUSE / Void / Other
        - macOS — Apple Silicon (M-series)
        - macOS — Intel (x86_64)
    validations:
      required: true
  - type: dropdown
    id: package_format
    attributes:
      label: Package / Binary Type
      options:
        - Windows Portable (.exe)
        - Windows Installer (Setup .exe / .msi)
        - Linux AppImage (.AppImage)
        - Linux DEB package (.deb)
        - Linux Standalone Archive (.tar.gz / AUR)
        - Android APK (arm64-v8a / universal)
        - macOS DMG (.dmg / .app)
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: e.g. 26.8.1
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open '...'
        2. Click '...'
        3. See error
    validations:
      required: false
  - type: textarea
    id: logs_or_screenshots
    attributes:
      label: Screenshots or Logs
      placeholder: Paste error logs or drag-and-drop screenshots here.
    validations:
      required: false
