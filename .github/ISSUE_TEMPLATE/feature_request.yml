name: Feature Request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      placeholder: What feature or improvement would you like to see?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional Context
      placeholder: Any mockups, examples, or thoughts on how it should work.
    validations:
      required: false
  - type: checkboxes
    id: willingness
    attributes:
      label: Implementation
      options:
        - label: I am willing to submit a Pull Request for this feature
          required: false
