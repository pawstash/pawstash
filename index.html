<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pawstash</title>
    <style>
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #131313;
        color: #e3e3e3;
        pointer-events: auto;
        opacity: 1;
        transition: opacity 200ms ease;
      }
      #boot-screen.is-hidden {
        opacity: 0;
      }
      .boot-mark {
        width: 48px;
        height: 48px;
        color: inherit;
        animation: boot-logo-in 700ms cubic-bezier(.16, 1, .3, 1) both;
      }
      .boot-mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      @keyframes boot-logo-in {
        0% {
          opacity: 0;
          width: min(100vw, 100vh);
          height: min(100vw, 100vh);
        }
        35% {
          opacity: 1;
        }
        100% {
          opacity: 1;
          width: 48px;
          height: 48px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark {
          width: 48px;
          height: 48px;
          animation: none;
        }
        #boot-screen { transition: none; }
      }
    </style>
  </head>
  <body class="bg-transparent overflow-hidden select-none font-sans text-ink">
    <div id="boot-screen" role="status" aria-label="Loading Pawstash" data-tauri-drag-region="deep">
      <div class="boot-mark" aria-hidden="true">
        <svg viewBox="0 0 602 602" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(0, 8.5)">

          </g>
        </svg>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
